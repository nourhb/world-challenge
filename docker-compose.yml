services:
  postgres:
    image: postgres:16-alpine
    container_name: world-challenge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: worldchallenge
      POSTGRES_PASSWORD: worldchallenge
      POSTGRES_DB: worldchallenge
    ports:
      # Host 5433 avoids clashes with a local PostgreSQL already bound to 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldchallenge -d worldchallenge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: world-challenge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: world-challenge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://worldchallenge:worldchallenge@postgres:5432/worldchallenge
      JWT_ACCESS_SECRET: replace-with-a-long-random-access-secret
      JWT_REFRESH_SECRET: replace-with-a-long-random-refresh-secret
      FRONTEND_URL: http://localhost:5180
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: world-challenge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "5180:5180"

volumes:
  postgres_data:
